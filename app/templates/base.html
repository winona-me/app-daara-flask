<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{   url_for('static', filename='favicon.png') }}">
    <title>{% block title %}Daara{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f0; }
        nav { background: #2f6b52; padding: 14px 24px; }
        nav a { color: #fff; text-decoration: none; margin-right: 20px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; background: #fff; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #eef3ee; }
        .flash { padding: 12px 16px; border-radius: 4px; margin-bottom: 14px; }
        .flash-success { background: #e6f4ea; color: #1e4620; border: 1px solid #b7dfc0; }
        .flash-danger { background: #fbe9e7; color: #611a15; border: 1px solid #f3b8ae; }
        form.inline { display: inline; }
        .btn-daara { background: #2f6b52; color: #fff; }
        .btn-daara:hover { background: #24523f; color: #fff; }
        .table-daara thead th { background: #eef3ee; }
        input, select, textarea { box-sizing: border-box; }
        label { font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('main.accueil') }}">Daara</a>
        <a href="{{ url_for('maitres.lister') }}">Maîtres</a>
        <a href="{{ url_for('classes.lister') }}">Classes</a>
        <a href="{{ url_for('talibes.lister') }}">Talibés</a>
        <a href="{{ url_for('progressions.lister') }}">Progressions</a>
    </nav>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS (nécessaire pour les menus, alertes fermables, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
